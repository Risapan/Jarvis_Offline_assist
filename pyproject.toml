[project]
name = "jarvis"
version = "0.1.0"
description = "Offline real-time voice assistant: local LLM brain, Kokoro voice, persistent memory"
readme = "README.md"
authors = [{ name = "risapan" }]
requires-python = ">=3.12"
dependencies = [
    "kokoro-onnx>=0.6.1",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "webrtcvad-wheels>=2.0.14.post1",
]

[project.scripts]
jarvis = "jarvis.main:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
